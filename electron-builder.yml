appId: com.luming.sotto
productName: Sotto

directories:
  output: dist/release
  buildResources: resources

files:
  # 只打包产物，绝不能包含 dist/release（否则旧安装包会被递归打进 asar）
  - dist/main.cjs
  - dist/preload.cjs
  - dist/renderer/**/*
  - resources/icon.png
  - package.json

# 独立语音输入应用：无 Dock 图标的菜单栏常驻应用
mac:
  category: public.app-category.utilities
  icon: resources/icon.png
  identity: null
  electronLanguages:
    - zh-CN
    - en
  target:
    - target: dmg
      arch:
        - arm64
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist
  extendInfo:
    NSMicrophoneUsageDescription: 呦呦（Sotto）需要访问麦克风进行语音识别
    NSAppleEventsUsageDescription: 呦呦（Sotto）需要向当前应用发送粘贴指令以输出语音文本
