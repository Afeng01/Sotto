<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4479E8"/>
      <stop offset="1" stop-color="#1B3A8A"/>
    </linearGradient>
    <linearGradient id="antler" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#FFB347"/>
      <stop offset="1" stop-color="#FFDF8E"/>
    </linearGradient>
  </defs>

  <!-- 底板 -->
  <rect width="1024" height="1024" rx="232" fill="url(#bg)"/>

  <!-- 中央波峰顶端长出鹿角：波形即鹿首 -->
  <g stroke="url(#antler)" stroke-width="38" fill="none" stroke-linecap="round">
    <!-- 左角：主枝 + 一分叉 -->
    <path d="M 497 296 C 478 220 442 166 372 132"/>
    <path d="M 466 224 C 448 206 428 195 404 188"/>
    <!-- 右角 -->
    <path d="M 527 296 C 546 220 582 166 652 132"/>
    <path d="M 558 224 C 576 206 596 195 620 188"/>
  </g>

  <!-- 声音波形 -->
  <g fill="#ffffff">
    <rect x="204" y="472" width="66" height="150" rx="33"/>
    <rect x="334" y="372" width="66" height="350" rx="33"/>
    <rect x="464" y="262" width="66" height="550" rx="33"/>
    <rect x="594" y="372" width="66" height="350" rx="33"/>
    <rect x="724" y="472" width="66" height="150" rx="33"/>
  </g>
</svg>
